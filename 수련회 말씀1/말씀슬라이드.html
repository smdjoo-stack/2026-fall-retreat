<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수련회 말씀 1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #0A0A0A;
    --fg: #FFFFFF;
    --muted: rgba(255,255,255,0.6);
    --accent: #F2C46D;                /* 본문 출처·절 번호 */
    --verse-size: 60px;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--font); color: var(--fg); }
  body.idle { cursor: none; }

  /* 16:9 무대 — 1920×1080 고정 후 화면에 맞춰 확대/축소 */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px; overflow: hidden;
    background: var(--bg); transform-origin: center center;
  }

  /* 그림 슬라이드 — 그림 전체가 보이도록 맞추고, 남는 공간은 같은 그림을 흐리게 채움 */
  .pic-fill { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(0.35); }
  .pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  /* 본문 슬라이드 */
  .scripture { position: absolute; left: 10%; right: 10%; top: 120px; bottom: 120px; display: flex; flex-direction: column; }
  .ref { font-size: 40px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
  .ref small { font-size: 28px; font-weight: 500; color: var(--muted); margin-left: 16px; }
  .verses { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .verse { font-size: var(--verse-size); font-weight: 600; line-height: 1.55; word-break: keep-all; }
  .verse sup { font-size: 0.5em; font-weight: 700; color: var(--accent); vertical-align: 0.9em; margin-right: 10px; }
  .verse.todo { color: var(--muted); font-weight: 500; font-style: italic; }

  /* 표지 */
  .cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
  .cover h1 { font-size: 110px; font-weight: 800; }
  .cover p { font-size: 40px; color: var(--muted); }

  /* 기도제목 — 한 장에 한 항목 */
  .prayer { position: absolute; left: 10%; right: 10%; top: 50%; transform: translateY(-50%); text-align: center; }
  .prayer h2 { font-size: 52px; font-weight: 800; color: var(--accent); letter-spacing: 0.08em; }
  .prayer .pnum {
    width: 120px; height: 120px; margin: 56px auto 48px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: #111; font-size: 68px; font-weight: 800;
  }
  .prayer p { font-size: 96px; font-weight: 800; line-height: 1.35; word-break: keep-all; }
  .prayer .desc .pref { display: block; margin-top: 16px; font-size: 36px; font-weight: 600; color: var(--accent); }
  .prayer .desc { margin-top: 48px; font-size: 48px; font-weight: 500; line-height: 1.6; color: rgba(255,255,255,0.8); word-break: keep-all; }

  /* 차례 — 마우스를 움직일 때만 화면 아래에 나타남 */
  .toc {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 5% 36px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85) 40%);
    transition: opacity .3s; opacity: 1;
  }
  body.idle .toc, body.no-toc .toc { opacity: 0; pointer-events: none; }
  .toc span {
    font-size: 24px; font-weight: 600; padding: 6px 18px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    border: 2px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.65); background: rgba(0,0,0,0.4);
  }
  .toc span:hover { color: #fff; }
  .toc span.now { color: #fff; border-color: #fff; font-weight: 800; }

  /* 페이지 나누기 계산용 (화면에 보이지 않음) */
  #measure { position: absolute; left: -99999px; top: 0; width: 1920px; height: 1080px; visibility: hidden; }
  #measure .verses { justify-content: flex-start; }

  #help {
    display: none; position: fixed; right: 24px; top: 24px; z-index: 5;
    background: rgba(20,20,20,0.92); color: #ddd; font-size: 14px; line-height: 1.8; padding: 16px 20px; border-radius: 10px;
  }
  body.show-help #help { display: block; }
</style>
</head>
<body>

<div id="stage"></div>
<div id="measure"></div>

<div id="help">
  → / Space / PageDown : 다음<br>
  ← / PageUp : 이전<br>
  Home / End : 처음 / 끝<br>
  B : 검은 화면<br>
  F : 전체 화면<br>
  T : 아래 차례 켜기/끄기<br>
  ? : 이 도움말
</div>

<!--
  ▼ 슬라이드 순서와 본문 — 여기만 고치면 됩니다
    [그림] 파일명 | 차례에 보일 이름
    [본문] 성경 장:절 | 번역본
    [기도] 제목  (다음 줄부터 한 줄에 한 항목: 큰 제목 | 간단한 설명)
    절번호 본문 내용   (한 줄에 한 절. 화면에 맞게 자동으로 여러 장으로 나뉩니다)
-->
<script type="text/plain" id="deck-data">
[그림] 설교1-1.png | 그림 1-1
[그림] 설교1-2.png | 그림 1-2

[본문] 베드로전서 2:4-5 | 새번역
4 주님께 나아오십시오. 그는 사람에게 버림을 받으셨으나, 하나님께는 택하심을 받은 살아 있는 귀한 돌입니다.
5 살아 있는 돌과 같은 존재로서 여러분도 집 짓는 데 사용되어 신령한 집이 됩니다.

[그림] 설교2.png | 그림 2
[그림] 설교3.png | 그림 3

[본문] 고린도전서 3:5-15 | 새번역
5 그렇다면 아볼로는 무엇이고, 바울은 무엇입니까? 아볼로와 나는 여러분을 믿게 한 일꾼들이며, 주님께서 우리에게 각각 맡겨 주신 대로 일하였을 뿐입니다.
6 나는 심고, 아볼로는 물을 주었습니다. 그러나 하나님께서 자라게 하셨습니다.
7 그러므로 심는 사람이나 물 주는 사람은 아무것도 아니요, 자라게 하시는 분은 하나님이십니다.
8 심는 사람과 물 주는 사람은 하나이며, 그들은 각각 수고한 만큼 자기의 삯을 받을 것입니다.
9 우리는 하나님의 동역자요, 여러분은 하나님의 밭이며, 하나님의 건물입니다.
10 나는 하나님께서 나에게 주신 은혜를 따라, 지혜로운 건축가와 같이 기초를 놓았습니다. 그런데 다른 사람이 그 위에다가 집을 짓습니다. 그러나 어떻게 집을 지을지 각각 신중히 생각해야 합니다.
11 아무도 이미 놓은 기초이신 예수 그리스도 밖에 또 다른 기초를 놓을 수 없습니다.
12 누가 이 기초 위에 금이나 은이나 보석이나 나무나 풀이나 짚으로 집을 지으면,
13 그에 따라 각 사람의 업적이 드러날 것입니다. 그 날이 그것을 환히 보여 줄 것입니다. 그것은 불에 드러날 것이기 때문입니다. 불이 각 사람의 업적이 어떤 것인가를 검증하여 줄 것입니다.
14 어떤 사람이 만든 작품이 그대로 남으면, 그는 상을 받을 것이요,
15 어떤 사람의 작품이 타 버리면, 그는 손해를 볼 것입니다. 그러나 그 사람은 구원을 받을 것이지만 불 속을 헤치고 나오듯 할 것입니다.

[그림] 설교5.png | 그림 5
[그림] 설교6.png | 그림 6
[그림] 설교4.png | 그림 4

[본문] 느헤미야 4:9-17 | 새번역
9 그래서 우리는, 한편으로는 우리의 하나님께 기도를 드리고, 다른 한편으로는 경비병을 세워, 밤낮으로 지키게 하였다.
10 그런데 유다 사람들 사이에서 이런 노래가 퍼지고 있었다. 흙더미는 아직도 산더미 같은데, 짊어지고 나르다 힘이 다 빠졌으니, 우리 힘으로는 이 성벽 다 쌓지 못하리.
11 한편 우리의 원수들은, 쥐도 새도 모르게 쳐들어와서 우리를 죽여서, 일을 못하게 하려고 계획하고 있었다.
12 그들 가까이에서 사는 유다 사람들이 우리에게 올라와서, 그들이 사방에서 우리를 치려고 한다고, 열 번이나 일러주었다.
13 그래서 나는 백성 가운데서 얼마를 가문별로, 칼과 창과 활로 무장시켜서, 성벽 뒤 낮은 빈터에 배치하였다.
14 백성이 두려워하는 것을 보고, 나는 귀족들과 관리들과 그 밖의 백성들을 격려하였다. "그들을 두려워하지 말아라. 위대하고 두려운 주님을 기억하고, 형제자매와 자식과 아내와 가정을 지켜야 하니, 싸워라."
15 드디어 우리의 원수들은 자기들의 음모가 우리에게 새나갔다는 것을 알게 되었다. 하나님이 그들의 음모를 헛되게 하셨으므로, 우리는 모두 성벽으로 돌아와서, 저마다 하던 일을 계속하였다.
16 그 날부터 내가 데리고 있는 젊은이 가운데서 반은 일을 하고, 나머지 반은 창과 방패와 활과 갑옷으로 무장을 하였다. 관리들은 성벽을 쌓고 있는 유다 백성 뒤에 진을 쳤다.
17 짐을 나르는 이들은, 한 손으로는 짐을 나르고, 다른 한 손으로는 무기를 잡았다.

[그림] 설교7.png | 그림 7

[기도] 기도제목
나는 지금 쓰일 수 있는 돌인가? | 버려진 돌을 들어 쓰시는 주님 앞에, 오늘 쓰임 받는 산 돌로 서게 하소서. (벧전 2:5)
나는 서로 연결되어 있는가? | 혼자 서는 돌이 아니라, 서로 맞물려 하나님의 집을 이루는 공동체가 되게 하소서. (고전 3:9)
나는 끝까지 남는가? | 지치고 두려울 때에도 주님을 기억하며, 끝까지 성벽을 쌓는 사람이 되게 하소서. (느 4:14)
</script>
<!-- ▲ 끝 -->

<script>
(() => {
  const stage = document.getElementById("stage");
  const measure = document.getElementById("measure");
  let slides = [], sections = [], idx = 0, blackout = false;

  // ---------- 파싱 ----------
  function parse(text) {
    const items = [];
    let cur = null;
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line) continue;
      let m;
      if ((m = line.match(/^\[그림\]\s*(.+?)\s*(?:\|\s*(.+))?$/))) {
        items.push(cur = { type: "pic", src: m[1], label: m[2] || m[1] }); continue;
      }
      if ((m = line.match(/^\[본문\]\s*(.+?)\s*(?:\|\s*(.+))?$/))) {
        items.push(cur = { type: "text", ref: m[1], version: m[2] || "", verses: [] }); continue;
      }
      if ((m = line.match(/^\[기도\]\s*(.*)$/))) {
        items.push(cur = { type: "prayer", title: m[1] || "기도제목", list: [] }); continue;
      }
      if (cur && cur.type === "prayer") { cur.list.push(line); continue; }
      if (cur && cur.type === "text") {
        m = line.match(/^(\d+)\s+(.+)$/);
        if (m) cur.verses.push({ n: m[1], t: m[2] });
        else if (cur.verses.length) cur.verses.at(-1).t += " " + line;
      }
    }
    return items;
  }

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const verseHtml = v => `<div class="verse${/^⟪.*⟫$/.test(v.t) ? " todo" : ""}"><sup>${esc(v.n)}</sup>${esc(v.t)}</div>`;
  function textHtml(item, verses, part, total) {
    const page = total > 1 ? `<small>${part} / ${total}</small>` : "";
    return `<div class="scripture"><div class="ref">${esc(item.ref)}${item.version ? ` <small>${esc(item.version)}</small>` : ""}${page}</div>` +
      `<div class="verses">${verses.map(verseHtml).join("")}</div></div>`;
  }

  // 본문을 실제 화면 크기로 재 보면서, 넘치기 전까지 절을 한 장에 담는다
  function paginate(item) {
    const pages = [];
    let cur = [];
    const fits = vs => {
      measure.innerHTML = textHtml(item, vs, 9, 9);
      const box = measure.querySelector(".verses");
      return box.scrollHeight <= box.clientHeight;
    };
    for (const v of item.verses) {
      if (cur.length && !fits([...cur, v])) { pages.push(cur); cur = []; }
      cur.push(v);
    }
    if (cur.length) pages.push(cur);
    measure.innerHTML = "";
    return pages;
  }

  function build() {
    const items = parse(document.getElementById("deck-data").textContent);
    slides = [{ type: "cover" }];
    sections = [];
    for (const item of items) {
      if (item.type === "prayer") {
        // 기도제목은 한 항목씩 한 장
        item.list.forEach((t, i) => {
          sections.push({ label: `${item.title} ${i + 1}`, start: slides.length });
          const [head, desc = ""] = t.split("|").map(x => x.trim());
          slides.push({ type: "prayer", title: item.title, n: i + 1, text: head, desc, sec: sections.length - 1 });
        });
        continue;
      }
      sections.push({ label: item.type === "pic" ? item.label : item.ref, start: slides.length });
      if (item.type === "pic") slides.push({ type: "pic", src: item.src, sec: sections.length - 1 });
      else {
        const pages = paginate(item);
        pages.forEach((vs, i) => slides.push({ type: "text", item, verses: vs, part: i + 1, total: pages.length, sec: sections.length - 1 }));
      }
    }
    slides.push({ type: "black" });
  }

  // ---------- 화면 ----------
  function render() {
    const s = slides[idx];
    if (blackout || s.type === "black") { stage.innerHTML = ""; stage.style.background = "#000"; return; }
    stage.style.background = "";
    if (s.type === "cover") stage.innerHTML = `<div class="cover"><h1>수련회 말씀 1</h1><p>베드로전서 2:4-5 · 고린도전서 3:5-15 · 느헤미야 4:9-17</p></div>`;
    else if (s.type === "pic") stage.innerHTML = `<div class="pic-fill" style="background-image:url('${encodeURI(s.src)}')"></div><img class="pic" src="${encodeURI(s.src)}" alt="">`;
    else if (s.type === "prayer") stage.innerHTML = `<div class="prayer"><h2>${esc(s.title)}</h2>` +
      `<div class="pnum">${s.n}</div><p>${esc(s.text)}</p>${s.desc ? `<div class="desc">${esc(s.desc).replace(/\s*(\([^()]+\))\s*$/, '<span class="pref">$1</span>')}</div>` : ""}</div>`;
    else stage.innerHTML = textHtml(s.item, s.verses, s.part, s.total);
    stage.insertAdjacentHTML("beforeend", `<nav class="toc">${sections.map((x, i) =>
      `<span data-slide="${x.start}"${i === s.sec ? ' class="now"' : ""}>${esc(x.label)}</span>`).join("")}</nav>`);
  }

  function go(i) { idx = Math.max(0, Math.min(slides.length - 1, i)); blackout = false; render(); }
  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${k})`;
  }

  // ---------- 조작 ----------
  addEventListener("keydown", e => {
    const k = e.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); go(idx + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); go(idx - 1); }
    else if (k === "Home") go(0);
    else if (k === "End") go(slides.length - 1);
    else if (k === "b" || k === "B" || k === ".") { blackout = !blackout; render(); }
    else if (k === "f" || k === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
    else if (k === "t" || k === "T") document.body.classList.toggle("no-toc");
    else if (k === "?" || k === "/") document.body.classList.toggle("show-help");
  });
  stage.addEventListener("click", e => {
    const t = e.target.closest("[data-slide]");
    if (t) go(+t.dataset.slide);
    else go(e.clientX < innerWidth / 3 ? idx - 1 : idx + 1);
  });
  let idleTimer;
  const wake = () => {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
  };
  addEventListener("mousemove", wake);
  addEventListener("resize", fit);

  // 이미지 미리 불러오기 — 넘길 때 깜빡임 방지
  function preload() { slides.filter(s => s.type === "pic").forEach(s => { new Image().src = encodeURI(s.src); }); }

  fit();
  document.body.classList.add("idle");
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { build(); preload(); render(); });
})();
</script>
</body>
</html>
