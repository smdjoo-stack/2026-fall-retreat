<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교회 비전</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #0A0A0A;
    --fg: #FFFFFF;
    --accent: #F2C46D;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--font); color: var(--fg); }
  body.idle { cursor: none; }

  /* 16:9 무대 — 1920×1080 고정 후 화면에 맞춰 확대/축소 */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #1c1a16 0%, var(--bg) 70%);
    transform-origin: center center;
  }
  .statement {
    position: absolute; left: 10%; right: 10%; top: 50%; transform: translateY(-50%);
    text-align: center; word-break: keep-all;
  }
  .statement p { font-size: 66px; font-weight: 700; line-height: 1.65; }
  .statement b { color: var(--accent); font-weight: 800; }
</style>
</head>
<body>
<div id="stage">
  <div class="statement">
    <p>잃어버린 영혼을 <b>전도</b>하여 하나님을 만나게 하고,</p>
    <p>하나님을 <b>예배</b>하고,</p>
    <p><b>제자</b>로 성장하며,</p>
    <p>하나님 나라 <b>공동체</b>를 함께 세우고,</p>
    <p>세상 속으로 보냄을 받아 <b>선교</b>함으로</p>
    <p>하나님의 나라를 이루어 가는 교회입니다.</p>
  </div>
</div>
<script>
  const stage = document.getElementById("stage");
  const fit = () => stage.style.transform = `translate(-50%, -50%) scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`;
  addEventListener("resize", fit); fit();
  // F: 전체 화면 · 마우스를 3초간 움직이지 않으면 포인터 숨김
  addEventListener("keydown", e => {
    if (e.key === "f" || e.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  });
  let t;
  addEventListener("mousemove", () => {
    document.body.classList.remove("idle"); clearTimeout(t);
    t = setTimeout(() => document.body.classList.add("idle"), 3000);
  });
</script>
</body>
</html>
